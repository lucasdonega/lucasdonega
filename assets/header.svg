<svg width="900" height="180" viewBox="0 0 900 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucas Donega - GitHub profile card" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="900" height="180" rx="28"/>
    </clipPath>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="180" rx="28" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <circle cx="850" cy="10" r="120" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="690" cy="205" r="95" fill="#FFFFFF" fill-opacity="0.07"/>
  </g>

  <!-- Avatar (troque as iniciais pela sua foto, veja as instruções) -->
  <circle cx="82" cy="90" r="52" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="82" cy="90" r="46" fill="#FFFFFF"/>
  <text x="82" y="102" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2563EB">LD</text>

  <!-- Nome e link -->
  <text x="150" y="70" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Lucas Donega</text>
  <text x="150" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#E0F2FE">github.com/lucasdonega</text>

  <!-- Pílula 1: localização -->
  <rect x="150" y="118" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
  <g transform="translate(164 127)" fill="#2563EB">
    <path d="M8 0C4.7 0 2 2.6 2 5.9c0 4 6 10.1 6 10.1s6-6.1 6-10.1C14 2.6 11.3 0 8 0zm0 8.2a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z"/>
  </g>
  <text x="188" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">São Paulo, BR</text>

  <!-- Pílula 2: escola -->
  <rect x="310" y="118" width="180" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
  <g transform="translate(324 127)" fill="#2563EB">
    <path d="M8 1L0 5.2l8 4.2 6-3.1V11h2V5.2L8 1zM3 9.6v2.6C3 13.2 5.2 15 8 15s5-1.8 5-2.8V9.6l-5 2.6-5-2.6z"/>
  </g>
  <text x="348" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">SENAI São Caetano</text>

  <!-- Pílula 3: área -->
  <rect x="500" y="118" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.92"/>
  <g transform="translate(514 127)" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 3.5L1 8l4 4.5M11 3.5L15 8l-4 4.5"/>
  </g>
  <text x="538" y="140" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1E3A8A">Software Dev</text>
</svg>
